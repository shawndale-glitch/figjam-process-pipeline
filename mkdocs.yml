site_name: Process documentation
docs_dir: docs
theme:
  name: material
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Processes:
      - "P2P-03: Invoice approval": processes/procure-to-pay/P2P-03.md
  - Procedures:
      - procedures/index.md
      - "P2P-03-P01: Open an invoice": procedures/procure-to-pay/P2P-03-P01.md
      - "P2P-03-P02: Add an internal note": procedures/procure-to-pay/P2P-03-P02.md
      - "P2P-03-P03: Assign the cost centre": procedures/procure-to-pay/P2P-03-P03.md
      - "P2P-03-P04: Approve an invoice": procedures/procure-to-pay/P2P-03-P04.md
