site_name: Documentation that tests itself
site_description: One spec file per task generates the written guide, a narrated video with subtitles and an automated test. When the software changes, the guide fails CI before anyone follows it.
site_url: https://shawndale-glitch.github.io/figjam-process-pipeline/
repo_url: https://github.com/shawndale-glitch/figjam-process-pipeline
repo_name: figjam-process-pipeline
edit_uri: ""
docs_dir: docs
theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.top
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home:
      - "Overview": index.md
      - "How a guide catches a change": drift.md
  - Processes:
      - "P2P-03: Invoice approval": processes/procure-to-pay/P2P-03.md
  - Procedures:
      - procedures/index.md
      - "P2P-03-P01: Open an invoice": procedures/procure-to-pay/P2P-03-P01.md
      - "P2P-03-P02: Add an internal note": procedures/procure-to-pay/P2P-03-P02.md
      - "P2P-03-P03: Assign the cost centre": procedures/procure-to-pay/P2P-03-P03.md
      - "P2P-03-P04: Approve an invoice": procedures/procure-to-pay/P2P-03-P04.md
