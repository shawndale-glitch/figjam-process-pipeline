# Runs on every push and pull request: the library self-test (every rule must fire on a
# deliberately broken board or workbook, and the clean boards must pass) and a strict docs build.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tooling/selftest.py
      - run: mkdocs build --strict
